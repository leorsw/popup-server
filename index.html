<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>התראות AI</title>
</head>
<body>
  <h1>מערכת התראות AI</h1>
  <button id="subscribeBtn">הפעל התראות</button>

  <script>
    const BACKEND_URL = 'https://popup-server-cq3c.onrender.com';
    const PUBLIC_VAPID_KEY = '5e32e11bac5dac2c5a4df0be8cc97fd4';

    if ('serviceWorker' in navigator && 'PushManager' in window) {
      // רישום בנתיב יחסי
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker נרשם'))
        .catch(err => console.error('שגיאה ברישום:', err));
    }

    document.getElementById('subscribeBtn').addEventListener('click', async () => {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        alert('יש לאשר התראות בדפדפן');
        return;
      }

      const registration = await navigator.serviceWorker.ready;
      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
      });

      // שליחת הרישום לשרת ב-Render
      await fetch(`${BACKEND_URL}/api/subscribe`, {
        method: 'POST',
        body: JSON.stringify(subscription),
        headers: { 'Content-Type': 'application/json' }
      });

      alert('ההתראות הופעלו בהצלחה!');
    });

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }
  </script>
</body>
</html>
