<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>התראות AI</title>
</head>
<body>
  <h1>מערכת התראות AI</h1>
  <button id="subscribeBtn">הפעל התראות</button>

  <!-- אזור תצוגת הודעות שנשלחו/התקבלו -->
  <section id="messages-container" style="margin-top: 20px; text-align: right; max-width: 500px; margin: 0 auto;">
    <h3>📥 הודעות אחרונות מהסוכן:</h3>
    <div id="messages-list" style="border: 1px solid #ccc; padding: 10px; border-radius: 8px; min-height: 80px; background: #f9f9f9;">
      <p id="no-messages" style="color: #888; margin: 0;">עוד לא התקבלו הודעות...</p>
    </div>
  </section>

  <script>
    // האזנה להודעות שמגיעות מה-Service Worker בזמן אמת
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        console.log('התקבלה הודעה ב-index.html:', event.data);

        if (event.data && event.data.type === 'PUSH_NOTIFICATION_RECEIVED') {
          const { title, body, timestamp } = event.data.payload;
          
          const list = document.getElementById('messages-list');
          const noMsg = document.getElementById('no-messages');
          if (noMsg) noMsg.remove();

          const item = document.createElement('div');
          item.style.cssText = "border-bottom: 1px solid #ddd; padding: 8px 0; margin-bottom: 5px;";
          item.innerHTML = `
            <strong style="color: #2b6cb0;">${title}</strong>
            <p style="margin: 4px 0 2px 0;">${body}</p>
            <small style="color: #718096; font-size: 0.8em;">${new Date(timestamp).toLocaleTimeString('he-IL')}</small>
          `;
          
          list.prepend(item); // הוספת ההודעה בראש הרשימה
        }
      });
    }
  </script>

  <script>
    const BACKEND_URL = 'https://popup-server-cq3c.onrender.com';
    const PUBLIC_VAPID_KEY = 'BPA_3kPoq0s31n9DQwUGkxQsOi5OZu6G0_7NJF3jj_DlMa5JXTsRml9aOFG_i5H05vxVsr-gFv6xsp61y3NebdE';

    // פונקציית עזר להמרת מפתח ה-VAPID
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/\-/g, '+')
        .replace(/_/g, '/');

      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);

      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    // רישום ה-Service Worker והאזנה לשינוי שליטה
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('Service Worker נרשם בהצלחה:', reg))
        .catch(err => console.error('שגיאה ברישום Service Worker:', err));

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        console.log('ה-Service Worker קיבל שליטה על העמוד');
      });
    }

    // טיפול בלחיצה על כפתור הפעלת ההתראות
    document.getElementById('subscribeBtn').addEventListener('click', async () => {
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          alert('יש לאשר התראות בדפדפן');
          return;
        }

        const registration = await navigator.serviceWorker.ready;
        const subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
        });

        console.log('Subscription נוצר בהצלחה:', subscription);

        // שליחת ה-Subscription לשרת ב-Render
        const res = await fetch(`${BACKEND_URL}/api/subscribe`, {
          method: 'POST',
          body: JSON.stringify(subscription),
          headers: { 'Content-Type': 'application/json' }
        });

        if (res.ok) {
          console.log('Subscription נשמר בשרת בהצלחה!');
          alert('ההתראות הופעלו ונשמרו בשרת בהצלחה!');
        } else {
          console.error('שגיאה בשמירה בשרת:', res.statusText);
          alert('אישור ההתראות בוצע, אך שמירת הנתונים בשרת נכשלה.');
        }

      } catch (err) {
        console.error('שגיאה במהלך ההרשמה:', err);
        alert('אירעה שגיאה בהפעלת ההתראות. בדוק את ה-Console.');
      }
    });
  </script>
</body>
</html>
